[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "summit-network"
version = "0.2.0"
description = "Privacy-first attendee-to-network matching on your own Mac"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Summit Network contributors"}]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
]

[project.scripts]
summit-network = "summit_network.__main__:main"

[tool.setuptools.packages.find]
include = ["summit_network*"]
