name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Check release version and run tests
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          test -f "docs/releases/$version.md"
          echo "SPAN_VERSION=$version" >> "$GITHUB_ENV"
          swift test
          ./scripts/test_app_workflow.sh
          python3 -m unittest discover -s Tests -p 'test_*.py' -v

      - name: Require signing credentials
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$CERTIFICATE"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"

      - name: Install signing certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/span-certificate.p12"
          keychain_path="$RUNNER_TEMP/span-signing.keychain-db"
          printf '%s' "$CERTIFICATE" | base64 -D > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security import "$certificate_path" -k "$keychain_path" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"

      - name: Build signed universal app and disk image
        run: |
          identity=$(security find-identity -v -p codesigning "$RUNNER_TEMP/span-signing.keychain-db" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          test -n "$identity"
          SIGNING_IDENTITY="$identity" REQUIRE_DMG=1 ./scripts/build_app.sh

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "dist/Span-$SPAN_VERSION.dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "dist/Span-$SPAN_VERSION.dmg"
          xcrun stapler validate "dist/Span-$SPAN_VERSION.dmg"
          codesign --verify --deep --strict dist/Span.app
          spctl --assess --type open --context context:primary-signature --verbose "dist/Span-$SPAN_VERSION.dmg"
          cp "dist/Span-$SPAN_VERSION.dmg" dist/Span-macOS.dmg
          (cd dist && shasum -a 256 Span-macOS.dmg > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Span-macOS
          path: |
            dist/Span-macOS.dmg
            dist/SHA256SUMS.txt

      - name: Prepare draft GitHub release for pilot testing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Span-macOS.dmg dist/SHA256SUMS.txt --draft --verify-tag --title "Span $SPAN_VERSION" --notes-file "docs/releases/$SPAN_VERSION.md"

      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/span-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/span-certificate.p12"
