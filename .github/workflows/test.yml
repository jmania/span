name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s Tests -p 'test_*.py' -v

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: ./scripts/build_app.sh .build/ci-output
      - run: codesign --verify --deep --strict '.build/ci-output/Small World.app'
